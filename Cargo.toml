[package]
name = "mindmount"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Local-first Markdown knowledge server for humans and AI"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
notify = "8.2"
percent-encoding = "2.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rmcp = { version = "3.9.0", features = ["transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0"
tempfile = "3"
tokio = { version = "1.40", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"
axum = "0.8.9"
askama = "0.16.1"
ammonia = "4.2.4"
ignore = "0.4.34"
regex = "1.13.1"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
